<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voice of Ming</title>
<style>
  :root { --bg:#0d0f12; --fg:#f2f2f2; --dim:#8a9099; --accent:#e8412c; --panel:#1a1d22; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.4 system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px 16px; gap:20px; }
  h1 { margin:0; font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .gauges { display:flex; gap:48px; flex-wrap:wrap; justify-content:center; }
  .gauge { text-align:center; }
  .big { font-size:96px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .unit { color:var(--dim); }
  #start { font-size:28px; font-weight:700; padding:22px 64px; border:0; border-radius:999px;
           background:var(--accent); color:#fff; cursor:pointer; }
  #start.on { background:#333; }
  .panel { background:var(--panel); border-radius:16px; padding:18px 22px; width:min(640px,100%);
           display:grid; grid-template-columns:auto 1fr auto; gap:14px 16px; align-items:center; }
  input[type=range] { width:100%; height:36px; }
  .row-full { grid-column:1 / -1; display:flex; gap:12px; flex-wrap:wrap; }
  .seg button { font-size:18px; padding:12px 20px; border-radius:10px; border:1px solid #444;
                background:transparent; color:var(--fg); }
  .seg button.sel { background:var(--fg); color:var(--bg); }
  #status { color:var(--dim); font-size:15px; text-align:center; min-height:1.4em; }
  #debug { color:var(--dim); font:13px ui-monospace, monospace; text-align:center; margin-top:-12px; }
</style>
</head>
<body>
<h1>The Voice of Ming</h1>

<div class="gauges">
  <div class="gauge"><div class="big" id="speed">0</div><div class="unit" id="unitLabel">km/h</div></div>
  <div class="gauge"><div class="big" id="gear">N</div><div class="unit">gear</div></div>
  <div class="gauge"><div class="big" id="rpm">0</div><div class="unit">rpm</div></div>
</div>

<button id="start">START ENGINE</button>
<div id="status">Tap start, then allow location access.</div>
<div id="debug"></div>

<div class="panel">
  <div class="row-full seg" id="modeSeg">
    <button data-mode="gps" class="sel">GPS drive</button>
    <button data-mode="test">Test drive (parked)</button>
  </div>
  <label for="testSpeed">Test speed</label><input id="testSpeed" type="range" min="0" max="160" value="0"><span id="testSpeedVal">0</span>
  <label for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="80"><span id="volumeVal">80%</span>
  <label for="crackle">Crackle</label><input id="crackle" type="range" min="0" max="100" value="60"><span id="crackleVal">60%</span>
  <div class="row-full seg" id="unitSeg">
    <button data-unit="kmh" class="sel">km/h</button>
    <button data-unit="mph">mph</button>
  </div>
</div>

<script>
// ---------- Engine model: 2006–2015 Mazda MX-5 (NC), 2.0 L MZR inline-4, 6-speed manual ----------
const ENGINE = {
  idle: 850, redline: 7200,
  ratios: [3.815, 2.260, 1.640, 1.177, 1.000, 0.832],
  finalDrive: 3.909,
  tireCircM: 1.921,                                       // 205/50R16
};
// km/h per 1000 rpm in each gear
const KMH_PER_1000 = ENGINE.ratios.map(r => 1000 / (r * ENGINE.finalDrive) * ENGINE.tireCircM * 60 / 1000);

let ctx, nodes, noiseBuf, mode = 'gps', unit = 'kmh';
let targetKmh = 0, midKmh = 0, shownKmh = 0, prevKmh = 0, accel = 0, gear = 1, rpm = ENGINE.idle, throttle = 0, drivePace = 0;
let watchId = null, lastFix = null;
let lastShift = 0, shiftCutUntil = 0, blipUntil = 0, crackleUntil = 0, lastLiftCrackle = 0, throttlePeak = 0, overrun = false;

const $ = id => document.getElementById(id);
const lerp = (a, b, x) => a + (b - a) * x;
const clamp01 = x => Math.max(0, Math.min(1, x));

function buildAudio(c = new (window.AudioContext || window.webkitAudioContext)()) {
  ctx = c;
  const master = ctx.createGain(); master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor();
  master.connect(comp).connect(ctx.destination);

  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  // Exhaust pulse train: an inline-4 fires twice per revolution, evenly spaced.
  // A sharp pulse has a rich, slowly falling harmonic series, which reads as "raspy" rather than a V8's burble.
  const N = 48, real = new Float32Array(N), imag = new Float32Array(N);
  for (let n = 1; n < N; n++) imag[n] = (n % 2 ? 1 : 0.75) / Math.pow(n, 0.75);
  const pulse = ctx.createOscillator(); pulse.setPeriodicWave(ctx.createPeriodicWave(real, imag));
  const pulseG = ctx.createGain(); pulseG.gain.value = 0.5;

  // Once-per-rev component: small cylinder-to-cylinder imbalance so it isn't a perfect buzz
  const crank = ctx.createOscillator(); crank.type = 'triangle';
  const crankG = ctx.createGain(); crankG.gain.value = 0.12;

  // Noise chopped by the firing pulses = straight-pipe rasp
  const noise = ctx.createBufferSource(); noise.buffer = noiseBuf; noise.loop = true;
  const noiseHp = ctx.createBiquadFilter(); noiseHp.type = 'highpass'; noiseHp.frequency.value = 500;
  const noiseAmp = ctx.createGain(); noiseAmp.gain.value = 0.05;
  const chop = ctx.createOscillator(); chop.type = 'square';
  const chopDepth = ctx.createGain(); chopDepth.gain.value = 0.05;
  chop.connect(chopDepth).connect(noiseAmp.gain);
  noise.connect(noiseHp).connect(noiseAmp);

  // Mix → drive → soft clip (harder with throttle) → tone shaping
  const mix = ctx.createGain();
  pulse.connect(pulseG).connect(mix); crank.connect(crankG).connect(mix); noiseAmp.connect(mix);
  const drive = ctx.createGain(); drive.gain.value = 1;
  const shaper = ctx.createWaveShaper();
  const curve = new Float32Array(2048);
  for (let i = 0; i < curve.length; i++) { const x = i / 1024 - 1; curve[i] = Math.tanh(2.5 * x); }
  shaper.curve = curve; shaper.oversample = '2x';
  const post = ctx.createGain(); post.gain.value = 0.35;   // undo the drive's loudness
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.Q.value = 0.9;
  // No muffler: an open pipe resonance gives the highway "drone" around 3,000–3,300 rpm…
  const drone = ctx.createBiquadFilter(); drone.type = 'peaking'; drone.frequency.value = 105; drone.Q.value = 3; drone.gain.value = 6;
  // …and a nasal mid-range honk/rasp that grows with load
  const rasp = ctx.createBiquadFilter(); rasp.type = 'peaking'; rasp.Q.value = 1.4;
  mix.connect(drive).connect(shaper).connect(post).connect(tone).connect(drone).connect(rasp).connect(master);

  // Pops and crackles bypass the tone filter so they stay sharp
  const crackleBus = ctx.createGain(); crackleBus.gain.value = 0.9;
  crackleBus.connect(master);

  [pulse, crank, noise, chop].forEach(n => n.start());
  nodes = { master, pulse, crank, chop, noiseAmp, chopDepth, drive, tone, rasp, crackleBus };
}

// One exhaust pop: a sharp band-passed noise crack plus a short low thump
function pop(time, strength) {
  const src = ctx.createBufferSource(); src.buffer = noiseBuf;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 800 + Math.random() * 2600; bp.Q.value = 0.7;
  const g = ctx.createGain();
  const len = 0.015 + Math.random() * 0.05;
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(strength, time + 0.002);
  g.gain.exponentialRampToValueAtTime(0.001, time + len);
  src.connect(bp).connect(g).connect(nodes.crackleBus);
  src.start(time, Math.random() * 1.8, len + 0.02);

  const o = ctx.createOscillator();
  o.frequency.setValueAtTime(90 + Math.random() * 70, time);
  o.frequency.exponentialRampToValueAtTime(40, time + 0.06);
  const og = ctx.createGain();
  og.gain.setValueAtTime(strength * 0.7, time);
  og.gain.exponentialRampToValueAtTime(0.001, time + 0.07);
  o.connect(og).connect(nodes.crackleBus); o.start(time); o.stop(time + 0.08);
}

function updateAudio(dt) {
  const t = ctx.currentTime, k = 0.03;
  const fire = rpm / 30;                                   // inline-4: 2 firings per rev (Hz)
  const jitter = 1 + (Math.random() - 0.5) * 0.008;        // tiny combustion irregularity
  nodes.pulse.frequency.setTargetAtTime(fire * jitter, t, k);
  nodes.chop.frequency.setTargetAtTime(fire, t, k);
  nodes.crank.frequency.setTargetAtTime(rpm / 60, t, k);

  const load = throttle, r = rpm / ENGINE.redline;
  nodes.drive.gain.setTargetAtTime(0.8 + load * 2.6 + r * 0.8, t, k);
  nodes.noiseAmp.gain.setTargetAtTime(0.03 + load * 0.18 + r * 0.06, t, k);
  nodes.chopDepth.gain.setTargetAtTime(0.03 + load * 0.18 + r * 0.06, t, k);
  nodes.tone.frequency.setTargetAtTime(500 + rpm * 0.45 + load * 3200, t, k);
  nodes.rasp.frequency.setTargetAtTime(950 + rpm * 0.06, t, k);
  nodes.rasp.gain.setTargetAtTime(2 + load * 7, t, k);

  const vol = $('volume').value / 100;
  nodes.master.gain.setTargetAtTime(vol * (0.22 + 0.45 * load + 0.33 * r), t, k);

  // Crackle: a burst after lifting off from high revs, plus the odd pop on a long overrun
  const amount = $('crackle').value / 100;
  const now = performance.now();
  let rate = 0;                                            // pops per second
  if (now < crackleUntil) rate = 16;
  else if (overrun && rpm > 3000) rate = 2.5;
  rate *= amount;
  if (rate > 0 && Math.random() < rate * dt) {
    const strength = (0.25 + Math.random() * 0.5) * (0.5 + 0.5 * amount);
    pop(t, strength);
    // pops come in little clusters
    for (let i = 0, n = Math.floor(Math.random() * 3); i < n; i++) pop(t + 0.025 + Math.random() * 0.06, strength * (0.4 + Math.random() * 0.5));
  }
}

// ---------- Drivetrain ----------
function step(dt) {
  const now = performance.now();
  const src = mode === 'test' ? +$('testSpeed').value * (unit === 'mph' ? 1.609 : 1) : targetKmh;
  // GPS arrives ~1 Hz with a few km/h of noise. Two cascaded smoothers turn each step into a gentle S-curve.
  const a1 = 1 - Math.exp(-dt / 0.7);
  midKmh += (src - midKmh) * a1;
  shownKmh += (midKmh - shownKmh) * a1;
  const rawAccel = (shownKmh - prevKmh) / Math.max(dt, 1e-3);  // km/h per second
  prevKmh = shownKmh;
  accel += (rawAccel - accel) * (1 - Math.exp(-dt / 1.2));

  // Throttle guess: acceleration (an NC pulls ~12 km/h/s flat out in 2nd) plus a little road load when cruising.
  // Small speed changes are just GPS noise or holding speed, so treat them as steady cruise.
  const DEADBAND = 1.5;
  const effAccel = Math.abs(accel) < DEADBAND ? 0 : accel - Math.sign(accel) * DEADBAND;
  overrun = effAccel < -1.5;
  const driverWant = overrun ? 0 : clamp01(effAccel / 10 + (shownKmh > 5 ? 0.15 : 0));
  let want = driverWant;
  if (now < shiftCutUntil) want = 0;                       // clutch in during an upshift
  if (now < blipUntil) want = 0.6;                         // heel-toe blip on a downshift
  // Shift/blip changes are deliberate and quick; everything else eases in
  const quick = now < shiftCutUntil || now < blipUntil;
  throttle += (want - throttle) * (1 - Math.exp(-dt / (quick ? 0.05 : 0.35)));
  // Slow "how hard am I driving" signal for shift points, so one noisy fix can't move them
  drivePace += (throttle - drivePace) * (1 - Math.exp(-dt / 2.5));

  // Lift-off from real load at high rpm → crackle burst
  // Remember recent load for a few seconds: smoothed decel takes a moment to show up after you lift
  throttlePeak = Math.max(throttle, throttlePeak - dt * 0.15);
  // Lifted = off the gas, or already slowing with throttle well under the recent average.
  // (driverWant, not want: the throttle cut during an upshift isn't a lift)
  const lifted = driverWant < 0.05 || (accel < -0.5 && throttle < drivePace - 0.3);
  if (lifted && throttlePeak > 0.35 && rpm > 3200 && now - lastLiftCrackle > 3000) {
    crackleUntil = now + 700 + Math.random() * 1100;
    lastLiftCrackle = now;
    throttlePeak = 0;
  }

  if (shownKmh < 2) { gear = 0; rpm += (ENGINE.idle - rpm) * Math.min(1, dt * 3); return; }
  if (gear === 0) gear = 1;
  const rpmIn = g => shownKmh / KMH_PER_1000[g - 1] * 1000;
  // Short-shift when cruising, wring it out under load
  // Wide gap between up/down points + minimum time in gear = no gear hunting at a steady speed
  // pace = load above plain cruising (0.15), so steady driving short-shifts like a normal driver
  const pace = clamp01((drivePace - 0.15) / 0.85);
  const upAt = lerp(2800, 6900, clamp01(Math.max(pace, (throttle - 0.45) / 0.55) * 1.3));
  const downAt = lerp(1300, 2400, pace);
  if (now - lastShift > 2000) {
    // Nobody upshifts while coasting or easing off the gas (unless about to hit the limiter).
    // Easing off = throttle well below the recent average; GPS smoothing shows this before real decel.
    const coasting = overrun || driverWant < 0.05 || throttle < drivePace - 0.2;
    if (rpmIn(gear) > (coasting ? ENGINE.redline - 200 : upAt) && gear < ENGINE.ratios.length) {
      gear++; lastShift = now; shiftCutUntil = now + 180;
      if (rpm > 4500) crackleUntil = now + 250;            // a pop or two on a hard upshift
    } else if (rpmIn(gear) < downAt && gear > 1) {
      gear--; lastShift = now;
      if (throttle < 0.2) blipUntil = now + 140;
    }
  }
  const target = Math.max(ENGINE.idle, Math.min(ENGINE.redline, rpmIn(gear)));
  // Fast right after a shift (the revs really do drop that fast), smooth otherwise
  rpm += (target - rpm) * (1 - Math.exp(-dt / (now - lastShift < 400 ? 0.08 : 0.25)));
}

function render() {
  const s = unit === 'mph' ? shownKmh / 1.609 : shownKmh;
  $('speed').textContent = Math.round(s);
  $('gear').textContent = gear === 0 ? 'N' : gear;
  $('rpm').textContent = Math.round(rpm / 50) * 50;
}

let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  step(dt); render(); if (ctx) updateAudio(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- GPS ----------
let fixCount = 0, rawMps = null, derivedMps = 0;
const MAX_MPS = 300 / 3.6, STALE_MS = 15000;
const history = [];                                        // recent fixes, for distance / time speed

function metersBetween(a, b) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLon = toR(b.lon - a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function onFix(p) {
  fixCount++;
  const fix = { lat: p.coords.latitude, lon: p.coords.longitude, t: p.timestamp, acc: p.coords.accuracy };
  history.push(fix);
  while (history.length > 2 && fix.t - history[0].t > 10000) history.shift();

  // Speed from movement over the last few seconds; ignore drift smaller than the fix accuracy
  derivedMps = 0;
  const first = history[0];
  const sec = (fix.t - first.t) / 1000;
  if (sec >= 1) {
    const dist = metersBetween(first, fix);
    if (dist > Math.max(fix.acc, first.acc) * 0.5) derivedMps = dist / sec;
  }
  // Wi-Fi location can teleport; a "speed" above ~300 km/h is a bad fix, not driving. Start over from here.
  if (derivedMps > MAX_MPS) { derivedMps = 0; history.splice(0, history.length - 1); }

  // Real GPS (Tesla, phones) reports speed directly; laptops often report null or a constant 0
  rawMps = p.coords.speed;
  const mps = rawMps != null && !isNaN(rawMps) && rawMps > 0 && rawMps < MAX_MPS ? rawMps : derivedMps;
  targetKmh = Math.max(0, mps * 3.6);
  lastFix = p;
  $('status').textContent = `GPS ok · accuracy ±${Math.round(fix.acc)} m`;
}

// Debug readout so you can see what the device is actually sending
setInterval(() => {
  if (!fixCount) return;
  const age = lastFix ? ((Date.now() - lastFix.timestamp) / 1000).toFixed(0) : '–';
  const raw = rawMps == null || isNaN(rawMps) ? 'none' : (rawMps * 3.6).toFixed(1);
  $('debug').textContent = `fixes ${fixCount} · last ${age}s ago · device speed ${raw} · from movement ${(derivedMps * 3.6).toFixed(1)} km/h`;
  // No fix for a while: assume stopped rather than freezing at the last speed
  if (lastFix && Date.now() - lastFix.timestamp > STALE_MS) {
    targetKmh = 0;
    $('status').textContent = '⚠ No location updates for ' + age + 's. This device probably has no GPS chip; try a phone or the car browser.';
  }
}, 1000);
function startGps() {
  if (!navigator.geolocation) { $('status').textContent = 'No geolocation in this browser.'; return; }
  watchId = navigator.geolocation.watchPosition(onFix,
    e => $('status').textContent = 'Location error: ' + e.message,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
}

// ---------- UI ----------
$('start').onclick = async () => {
  if (!ctx) { buildAudio(); startGps(); }
  if (ctx.state === 'running') { await ctx.suspend(); $('start').textContent = 'START ENGINE'; $('start').classList.remove('on'); }
  else { await ctx.resume(); $('start').textContent = 'STOP ENGINE'; $('start').classList.add('on'); }
};
$('modeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode;
  [...$('modeSeg').children].forEach(x => x.classList.toggle('sel', x === b));
};
$('unitSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  unit = b.dataset.unit;
  [...$('unitSeg').children].forEach(x => x.classList.toggle('sel', x === b));
  $('unitLabel').textContent = unit === 'mph' ? 'mph' : 'km/h';
  $('testSpeed').max = unit === 'mph' ? 100 : 160;
};
$('testSpeed').oninput = () => $('testSpeedVal').textContent = $('testSpeed').value;
$('volume').oninput = () => $('volumeVal').textContent = $('volume').value + '%';
$('crackle').oninput = () => $('crackleVal').textContent = $('crackle').value + '%';
</script>
</body>
</html>
